[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cargo-packager = { version = "0.11", default-features = false, features = [
  "rustls-tls",
] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", default-features = false }

lux-workspace-hack = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }

[dependencies.xtask-lua]
version = "0.1.0"
path = "../xtask-lua/"
