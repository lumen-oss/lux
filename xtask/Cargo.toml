[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cargo-packager = { version = "0.11", default-features = false, features = [
  "rustls-tls",
] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", default-features = false }

lux-workspace-hack = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }

[dependencies.xtask-lua]
version = "0.1.0"
path = "../xtask-lua/"

# On msvc, we vendor openssl,
# but we don't want to do that when using xtask with nix

[target.'cfg(not(target_env = "msvc"))'.dependencies.lux-cli]
path = "../lux-cli"
default-features = false

[target.'cfg(target_env = "msvc")'.dependencies.lux-cli]
path = "../lux-cli"
default-features = false
features = ["vendored"]
