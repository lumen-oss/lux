name: Setup Nix
description: Install Nix and restore the Nix store cache
inputs:
  cache-key:
    description: Cache key prefix, e.g. nix-build-x86_64-linux
    required: true
  gc-max-store-size-linux:
    description: Optional Nix store size cap before saving (Linux)
    required: false
    default: ""
  gc-max-store-size-macos:
    description: Optional Nix store size cap before saving (macOS)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          keep-derivations = true
          keep-outputs = true

    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: ${{ inputs.cache-key }}-${{ hashFiles('**/*.nix', '**/*.lock') }}
        restore-prefixes-first-match: ${{ inputs.cache-key }}-
        save: ${{ github.event_name == 'push' }}
        purge: ${{ github.event_name == 'push' }}
        purge-prefixes: ${{ inputs.cache-key }}-
        purge-created: 0
        purge-primary-key: never
        gc-max-store-size-linux: ${{ inputs.gc-max-store-size-linux }}
        gc-max-store-size-macos: ${{ inputs.gc-max-store-size-macos }}
