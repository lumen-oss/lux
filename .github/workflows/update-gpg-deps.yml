---
name: update-gpg-deps
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update GnuPG dependencies
        run: ./scripts/update-gpg-deps.sh
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT }}
          branch: update-gpg-deps
          title: "chore: update GnuPG dependencies"
          commit-message: "chore: update GnuPG dependencies"
          delete-branch: true
