---
name: "Nix build"
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [ main ]
jobs:
  build:
    if: github.event.pull_request.draft == false
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    permissions:
      id-token: "write"
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-24.04, target: x86_64-linux }
          - { os: macos-14, target: aarch64-darwin }
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31

    - name: Setup cachix
      uses: cachix/cachix-action@v17
      with:
        name: neorocks
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Git hooks
      run: nix build ".#checks.${{matrix.job.target}}.git-hooks-check" --accept-flake-config --log-lines 500 --fallback
      if: ${{ matrix.job.target == 'x86_64-linux' }}
      shell: bash

    - name: Clippy
      run: nix build ".#checks.${{matrix.job.target}}.clippy" --accept-flake-config --log-lines 500 --fallback
      shell: bash

    - name: Workspace hack
      run: nix build ".#checks.${{matrix.job.target}}.workspace-hack" --accept-flake-config --log-lines 500 --fallback
      if: ${{ matrix.job.target == 'x86_64-linux' }}

    - name: Tests
      run: nix build ".#checks.${{matrix.job.target}}.tests" --accept-flake-config --log-lines 500 --fallback
      shell: bash

    - name: Lua tests
      run: nix build ".#checks.${{matrix.job.target}}.lua-tests" --accept-flake-config --log-lines 500 --fallback
      shell: bash

    - name: Build devShell
      run: nix build ".#devShells.${{matrix.job.target}}.default" --accept-flake-config --log-lines 500 --fallback
      shell: bash

    - name: Build lux-cli
      run: |
        PACKAGE="lux-cli.debug"
        if [ "${{ github.event_name }}" = "push" ]; then
          PACKAGE="lux-cli"
        fi
        nix build ".#packages.${{matrix.job.target}}.${PACKAGE}" -Lv --accept-flake-config --log-lines 500 --fallback
      shell: bash

    - name: Build lux-luajit
      run: |
        PACKAGE="lux-luajit.debug"
        if [ "${{ github.event_name }}" = "push" ]; then
          PACKAGE="lux-luajit"
        fi
        nix build ".#packages.${{matrix.job.target}}.${PACKAGE}" -Lv --accept-flake-config --log-lines 500 --fallback
      shell: bash
      # FIXME: This fails with permission denied on darwin
      if: ${{ matrix.job.target == 'x86_64-linux' }}
    - name: Lux nix helper tests
      run: |
        nix build ".#checks.${{matrix.job.target}}.build-lux-helpers" -Lv --accept-flake-config --log-lines 500 --fallback
        nix build ".#checks.${{matrix.job.target}}.build-lux-helpers-import-lock" -Lv --accept-flake-config --log-lines 500 --fallback
        nix build ".#checks.${{matrix.job.target}}.build-lux-helpers-lux-vendor-dir" -Lv --accept-flake-config --log-lines 500 --fallback
        nix build ".#checks.${{matrix.job.target}}.build-lux-helpers-with-packages" -Lv --accept-flake-config --log-lines 500 --fallback
        nix build ".#checks.${{matrix.job.target}}.build-lux-helpers-lux-lock" -Lv --accept-flake-config --log-lines 500 --fallback
        nix build ".#checks.${{matrix.job.target}}.rockspec-cjson" -Lv --accept-flake-config --log-lines 500 --fallback
        nix build ".#checks.${{matrix.job.target}}.rockspec-luassert" -Lv --accept-flake-config --log-lines 500 --fallback
        nix build ".#checks.${{matrix.job.target}}.rockspec-toml-edit" -Lv --accept-flake-config --log-lines 500 --fallback
        nix build ".#checks.${{matrix.job.target}}.lux-project-toml-edit" -Lv --accept-flake-config --log-lines 500 --fallback
        nix build ".#checks.${{matrix.job.target}}.nvim-plugin" -Lv --accept-flake-config --log-lines 500 --fallback
        nix build ".#checks.${{matrix.job.target}}.nvim-plugin-luxHash" -Lv --accept-flake-config --log-lines 500 --fallback
      shell: bash
      # FIXME: lux-lua build fails with permission denied on darwin
      if: ${{ matrix.job.target == 'x86_64-linux' }}
