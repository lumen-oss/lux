---
name: update-libgpg-error
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update libgpg-error
        run: ./scripts/update-libgpg-error.sh
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          branch: update-libgpg-error
          title: "chore: update libgpg-error"
          commit-message: "chore: update libgpg-error"
          delete-branch: true
