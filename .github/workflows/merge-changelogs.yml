name: Merge changelogs

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Merge changelogs
        run: python3 .github/merge_changelogs.py
      - name: Commit Changes
        run: |
          git config --local user.email "marc@jakobi.dev"
          git config --local user.name "Marc Jakobi"
          if [[ ! -z $(git status -s) ]]; then
            git add .
            git commit -m "chore: merge per-package changelogs into root"
          fi
      - name: Push to Github
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository: "lumen-oss/lux"
          branch: main
